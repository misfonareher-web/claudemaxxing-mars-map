server {
 listen 80;
 root /app/web;
 index index.html;
 gzip on;
 gzip_types application/json application/geo+json text/css application/javascript;
 location = /config/scoring_weights.json { alias /app/config/scoring_weights.json; }
 location /api/ {
 include fastcgi_params;
 fastcgi_param SCRIPT_FILENAME /app/api/public/index.php;
 fastcgi_pass api:9000;
 }
 location / { try_files $uri $uri/ =404; }
}
