# Production config used by docker-compose.prod.yml. CORS is handled in PHP
# (CORS_ALLOWED_ORIGINS); do not add Access-Control-* headers here or browsers
# will see them twice and reject the response.
server {
 listen 80;
 server_name celc0r-realm.lol ares.celc0r-realm.lol;
 location /.well-known/acme-challenge/ { root /app/web; }
 location / { return 301 https://$host$request_uri; }
}

server {
 listen 443 ssl;
 server_name celc0r-realm.lol ares.celc0r-realm.lol;
 ssl_certificate /certs/fullchain.pem;
 ssl_certificate_key /certs/privkey.pem;
 root /app/web;
 index index.html;
 gzip on;
 gzip_types application/json application/geo+json text/css application/javascript;
 location = /config/scoring_weights.json { alias /app/config/scoring_weights.json; }
 location /api/ {
 include fastcgi_params;
 fastcgi_param SCRIPT_FILENAME /app/api/public/index.php;
 fastcgi_pass api:9000;
 }
 location / { try_files $uri $uri/ =404; }
}
