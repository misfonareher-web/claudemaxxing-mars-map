services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: mars
      POSTGRES_USER: mars
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD to a strong private password in .env}
    volumes: ["pgdata:/var/lib/postgresql/data", "./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U mars -d mars]
      interval: 2s
      retries: 30
  api:
    build: ./docker/php
    working_dir: /app
    volumes: [".:/app:ro"]
    environment:
      DB_DSN: pgsql:host=db;dbname=mars;connect_timeout=2
      DB_USER: mars
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD to a strong private password in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CLAUDEMAXXING_ROOT: /app
      SCORING_CMD: ${SCORING_CMD:-}
    depends_on:
      db:
        condition: service_healthy
  web:
    image: nginx:1.28-bookworm
    ports: ["${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"]
    volumes: [".:/app:ro", "./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api]
volumes:
  pgdata:
